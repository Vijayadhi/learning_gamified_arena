name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker
        run: pnpm build

      - name: Inject production D1 database ID
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_SESSION_SECRET: ${{ secrets.CLOUDFLARE_SESSION_SECRET }}
          CLOUDFLARE_FACILITATOR_EMAILS: ${{ secrets.CLOUDFLARE_FACILITATOR_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_SESSION_SECRET"
          test "${#CLOUDFLARE_SESSION_SECRET}" -ge 32
          test -n "$CLOUDFLARE_FACILITATOR_EMAILS"
          test -f dist/server/wrangler.json
          jq -e 'any(.d1_databases[]?; .binding == "DB")' dist/server/wrangler.json >/dev/null || {
            echo "No D1 binding named DB exists in dist/server/wrangler.json"
            exit 1
          }
          learners_json="$(jq -c . config/learners.json)"
          jq \
            --arg database_id "$CLOUDFLARE_D1_DATABASE_ID" \
            --arg facilitator_emails "$CLOUDFLARE_FACILITATOR_EMAILS" \
            --arg learners_json "$learners_json" \
            '.d1_databases = (.d1_databases | map(if .binding == "DB" then .database_id = $database_id else . end))
             | .migrations_dir = "../../drizzle"
             | .vars.STANDALONE_MODE = "true"
             | .vars.COOKIE_SECURE = "true"
             | .vars.FACILITATOR_EMAILS = $facilitator_emails
             | .vars.ALLOWED_LEARNER_EMAILS_JSON = $learners_json' \
            dist/server/wrangler.json > dist/server/wrangler.json.tmp
          mv dist/server/wrangler.json.tmp dist/server/wrangler.json

      - name: Validate Cloudflare configuration
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/dist/server/wrangler.json"
          jq . "$GITHUB_WORKSPACE/dist/server/wrangler.json"
          pnpm exec wrangler whoami

      - name: Apply D1 migrations
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations apply DB \
            --remote \
            --config "$GITHUB_WORKSPACE/dist/server/wrangler.json" \
            --yes

      - name: Deploy Worker
        env:
          CLOUDFLARE_SESSION_SECRET: ${{ secrets.CLOUDFLARE_SESSION_SECRET }}
        run: |
          pnpm exec wrangler deploy \
            --config dist/server/wrangler.json
          printf '%s' "$CLOUDFLARE_SESSION_SECRET" | \
            pnpm exec wrangler secret put SESSION_SECRET \
              --config dist/server/wrangler.json
